<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Baby Mo 🌙</title>
<style>
/* ─── TOKENS ─── */
:root{
  --navy:#0A1628; --navy2:#0F2044; --navy3:#162A56;
  --card:#1A3060; --card2:#1E3878;
  --gold:#FFD93D; --gold2:#F4A832;
  --green:#4EC94C; --green2:#3AAE38;
  --purple:#7C5CBF; --purple2:#9B79E8;
  --teal:#3ECFB8; --red:#FF6B6B;
  --text:#FFFFFF; --text2:#A8C4E8; --text3:#5A7AAA;
  --star:#D4EEFF;
}
/* ─── RESET ─── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:var(--navy);font-family:'Nunito','Arial Rounded MT Bold',Arial,sans-serif;touch-action:none;}
/* ─── SCREENS ─── */
.scr{display:none;position:fixed;inset:0;overflow:hidden;}
.scr.on{display:flex;flex-direction:column;}
/* ─── ANIMATIONS ─── */
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes floatChar{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(255,217,61,.3)}50%{box-shadow:0 0 40px rgba(255,217,61,.7),0 0 60px rgba(255,217,61,.3)}}
@keyframes pop{0%{transform:scale(0) rotate(-15deg);opacity:0}60%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wv{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes zz{0%{opacity:.7;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(1.5)}}
@keyframes dimIn{to{opacity:.82}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1.0)}50%{transform:scale(1.04)}}
@keyframes toothShine{0%{background-position:200%}100%{background-position:-200%}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ─── STARS BG ─── */
#stars-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
/* ─── PROGRESS BAR ─── */
.prog-bar{
  display:flex;align-items:center;gap:10px;
  padding:14px 24px 0;position:relative;z-index:2;
}
.prog-track{flex:1;height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#7EE87C);transition:width .5s ease;}
.prog-star{font-size:22px;}
.prog-home{font-size:22px;cursor:pointer;background:rgba(255,255,255,.1);border:none;
  border-radius:10px;padding:4px 8px;color:white;line-height:1;}
/* ─── STEP HEADING ─── */
.step-head{text-align:center;padding:10px 24px 0;position:relative;z-index:2;}
.step-num{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.step-title{font-size:26px;font-weight:900;color:white;line-height:1.2;}
.step-hint{font-size:14px;color:var(--text2);margin-top:4px;line-height:1.4;}
/* ─── BUTTONS ─── */
.btn-gold{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border:none;border-radius:100px;padding:18px 48px;
  font-family:inherit;font-size:20px;font-weight:900;color:var(--navy);
  cursor:pointer;display:inline-flex;align-items:center;gap:10px;
  box-shadow:0 6px 24px rgba(255,217,61,.4),0 2px 8px rgba(0,0,0,.3);
  animation:pulse 2.5s ease-in-out infinite;touch-action:manipulation;
}
.btn-gold:active{transform:scale(.95);}
/* ─── DONE BANNER ─── */
.done-banner{
  text-align:center;padding:12px 24px;z-index:2;position:relative;
  animation:slideUp .5s ease;
}
.done-emoji{font-size:44px;margin-bottom:6px;}
.done-text{font-family:inherit;font-size:22px;font-weight:900;}
/* ─── DUA LINES ─── */
.dua-line{
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);
  border-radius:20px;padding:16px 20px;cursor:pointer;
  position:relative;overflow:hidden;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  touch-action:manipulation;margin-bottom:10px;
}
.dua-line.locked{opacity:.3;cursor:default;}
.dua-line.active{border-color:rgba(255,217,61,.6);background:rgba(255,217,61,.1);}
.dua-line.done-line{border-color:rgba(78,201,76,.6);background:rgba(78,201,76,.1);}
.dua-arabic{font-size:26px;font-family:'Traditional Arabic','Amiri',serif;font-weight:700;text-align:right;direction:rtl;line-height:1.8;color:white;}
.dua-latin{font-size:13px;font-weight:700;color:var(--text2);font-style:italic;margin-top:2px;}
.dua-mean{font-size:12px;color:var(--text3);margin-top:2px;}
.dua-icon{position:absolute;top:14px;right:16px;font-size:20px;}
/* ─── PJ GRID ─── */
.pj-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:320px;}
.pj-item{
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);
  border-radius:22px;padding:22px 12px;text-align:center;cursor:pointer;
  position:relative;overflow:hidden;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);touch-action:manipulation;
}
.pj-item:active{transform:scale(.93);}
.pj-item.done-item{border-color:var(--green);background:rgba(78,201,76,.12);transform:scale(.96);}
.pj-emoji{font-size:52px;line-height:1;margin-bottom:8px;display:block;transition:all .3s;}
.pj-label{font-size:13px;font-weight:800;color:var(--text2);transition:color .3s;}
/* ─── BED ─── */
.bed-wrap{
  background:rgba(10,22,40,.8);border:2px solid var(--card2);
  border-radius:26px;overflow:hidden;position:relative;
  width:100%;max-width:300px;height:220px;flex-shrink:0;
}
.headboard{position:absolute;top:0;left:0;right:0;height:20px;
  background:var(--card2);border-radius:24px 24px 0 0;}
.pillow{position:absolute;top:26px;left:16px;right:16px;height:64px;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);
  border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:visible;}
.mattress{position:absolute;bottom:0;left:0;right:0;height:52%;background:rgba(10,22,40,.9);}
.blanket-outer{position:absolute;left:0;right:0;bottom:0;transition:top .3s ease;}
.blanket-body{position:absolute;inset:0;
  background:linear-gradient(160deg,#1A3E8C,#122B6A 30%,#1E3F8A 60%,#122B6A);}
.blanket-pattern{position:absolute;inset:0;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 12px,transparent 12px,transparent 24px);}
.blanket-fold{position:absolute;top:0;left:0;right:0;height:18px;
  background:linear-gradient(135deg,#2A5AB8,#1E3E90);border-radius:2px 2px 0 0;
  border-bottom:1px solid rgba(255,255,255,.1);}
.blanket-grip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:50px;height:5px;border-radius:99px;background:rgba(168,196,232,.5);
  box-shadow:0 0 12px rgba(168,196,232,.4);}
/* ─── RIPPLE ─── */
.ripple{position:absolute;border-radius:50%;pointer-events:none;
  animation:rippleOut .6s ease forwards;}
@keyframes rippleOut{0%{transform:scale(0);opacity:.6}100%{transform:scale(4);opacity:0}}
</style>
</head>
<body>

<script>
/* ════════════════════════════════════════════════════════
   BABY MO — PURE HTML5 VANILLA JS
   No React. No Babel. No frameworks.
   Native {passive:false} touch events everywhere.
════════════════════════════════════════════════════════ */

/* ── PREVENT ALL PAGE SCROLL ── */
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('touchstart',function(e){},{passive:false});

/* ── STARS ── */
(function(){
  var c=document.getElementById('stars-layer');
  for(var i=0;i<70;i++){
    var s=document.createElement('div');
    var sz=.5+Math.random()*2.5;
    s.style.cssText='position:absolute;border-radius:50%;background:var(--star);'
      +'width:'+sz+'px;height:'+sz+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;'
      +'opacity:'+(0.1+Math.random()*.9)+';'
      +'animation:twinkle '+(2+Math.random()*4)+'s '+(Math.random()*6)+'s infinite ease-in-out;';
    c.appendChild(s);
  }
})();

/* ── VIBRATE ── */
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms||40);}catch(e){}}

/* ── SPEAK ── */
function speak(txt){
  try{
    window.speechSynthesis&&window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(txt);
    u.lang='ar-SA';u.rate=.45;u.pitch=1.1;u.volume=1;
    window.speechSynthesis&&window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ── LULLABY (Web Audio pentatonic) ── */
var LUL=(function(){
  var ctx=null,gain=null,on=false,t=null,ni=0,nt=0;
  var N=[[196,.75],[220,.75],[247,.55],[196,.2],[220,.85],[294,.75],[330,.55],[294,.2],
         [220,.75],[196,.55],[247,.35],[196,.2],[165,1.3],[0,.5],
         [196,.65],[220,.65],[247,.45],[294,.65],[330,.85],[294,.55],[247,.55],[220,.55],[196,1.6],[0,.9]];
  function note(f,st,d){
    if(!f||!gain)return;
    var o=ctx.createOscillator(),e=ctx.createGain(),fl=ctx.createBiquadFilter();
    fl.type='lowpass';fl.frequency.value=480;o.type='sine';o.frequency.value=f;
    o.connect(fl);fl.connect(e);e.connect(gain);
    e.gain.setValueAtTime(0,st);e.gain.linearRampToValueAtTime(.55,st+Math.min(.07,d*.15));
    e.gain.exponentialRampToValueAtTime(.001,st+d-.05);o.start(st);o.stop(st+d);
  }
  function tick(){
    while(nt<ctx.currentTime+.7){var n=N[ni%N.length];note(n[0],nt,n[1]);nt+=n[1];ni++;}
    if(on)t=setTimeout(tick,200);
  }
  return{
    start:function(){if(on)return;try{
      ctx=new(window.AudioContext||window.webkitAudioContext)();
      gain=ctx.createGain();gain.gain.setValueAtTime(0,ctx.currentTime);
      gain.gain.linearRampToValueAtTime(.22,ctx.currentTime+6);
      gain.connect(ctx.destination);nt=ctx.currentTime+1.2;ni=0;on=true;tick();
    }catch(e){}},
    stop:function(){on=false;clearTimeout(t);
      if(gain&&ctx){gain.gain.linearRampToValueAtTime(0,ctx.currentTime+2.5);
        setTimeout(function(){try{ctx.close();}catch(e){}ctx=null;},3500);}}
  };
})();

/* ── SCREEN ROUTER ── */
function show(id){
  document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on');});
  document.getElementById('s-'+id).classList.add('on');
}

/* ── PROGRESS ── */
var stepProg=[0,25,50,75,100];
function setProgress(idx){
  document.getElementById('prog-fill').style.width=stepProg[idx]+'%';
}

/* ── HOME → STEPS ── */
document.getElementById('start-btn').addEventListener('click',function(){
  vib(60);show('steps');startStep(0);
});

var STEPS=[buildBrush,buildPajamas,buildDoa,buildBlanket];

function startStep(idx){
  setProgress(idx);
  var wrap=document.getElementById('step-wrap');
  wrap.style.transition='none';
  wrap.style.opacity='0';
  wrap.style.transform='translateY(30px)';
  wrap.innerHTML='';
  STEPS[idx](wrap,function(){advance(idx);});
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      wrap.style.transition='all .5s cubic-bezier(.34,1.56,.64,1)';
      wrap.style.opacity='1';
      wrap.style.transform='translateY(0)';
    });
  });
}

function advance(idx){
  var wrap=document.getElementById('step-wrap');
  wrap.style.transition='all .4s ease';
  wrap.style.opacity='0';
  wrap.style.transform='translateY(-24px)';
  setTimeout(function(){
    if(idx+1<STEPS.length){startStep(idx+1);}
    else{show('sleep');startSleep();}
  },420);
}

/* ── RIPPLE HELPER ── */
function ripple(el,e,color){
  var r=document.createElement('div');
  r.className='ripple';
  var rect=el.getBoundingClientRect();
  var touch=e.changedTouches?e.changedTouches[0]:e;
  var x=touch.clientX-rect.left, y=touch.clientY-rect.top;
  var sz=Math.max(rect.width,rect.height)*1.5;
  r.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(x-sz/2)+'px;top:'+(y-sz/2)+'px;'
    +'background:'+(color||'rgba(255,255,255,.35)')+';';
  el.appendChild(r);
  setTimeout(function(){r.remove();},700);
}

function buildBrush(wrap,done){

     +'<div class="step-title">🪥 Gosok Gigi</div>'

    /* Baby Mo brushing - SVG */
    +'<div style="display:flex;justify-content:center;padding:8px 0;position:relative;z-index:2;flex-shrink:0;">'
     +'<svg id="brush-char" width="140" height="130" viewBox="0 0 140 130">'
       +'<ellipse cx="70" cy="112" rx="44" ry="22" fill="#3D7A2E"/>'
       +'<ellipse cx="70" cy="96" rx="42" ry="32" fill="#4A9438"/>'
       +'<circle cx="70" cy="62" r="44" fill="#F5C895"/>'
       +'<circle cx="22" cy="28" r="15" fill="#4A9438"/>'
       +'<circle cx="22" cy="28" r="9" fill="#5DB347"/>'
       +'<circle cx="118" cy="28" r="15" fill="#4A9438"/>'
       +'<circle cx="118" cy="28" r="9" fill="#5DB347"/>'
       +'<circle cx="53" cy="56" r="12" fill="white"/>'
       +'<circle cx="87" cy="56" r="12" fill="white"/>'
       +'<circle cx="55" cy="57" r="7.5" fill="#2C1C0E"/>'
       +'<circle cx="89" cy="57" r="7.5" fill="#2C1C0E"/>'
       +'<circle cx="57" cy="54" r="2.5" fill="white"/>'
       +'<circle cx="91" cy="54" r="2.5" fill="white"/>'
       +'<ellipse cx="70" cy="70" rx="6" ry="4" fill="#E8956A"/>'
       /* open mouth with teeth */
       +'<path d="M 52 82 Q 70 100 88 82" fill="#1A0808" stroke="#C17045" stroke-width="2"/>'
       +'<rect id="t0" x="54" y="76" width="10" height="12" rx="3" fill="'+TOOTH_DARK+'"/>'
       +'<rect id="t1" x="65" y="74" width="10" height="14" rx="3" fill="'+TOOTH_DARK+'"/>'
       +'<rect id="t2" x="76" y="76" width="10" height="12" rx="3" fill="'+TOOTH_DARK+'"/>'
       +'<circle cx="40" cy="72" r="11" fill="#FFB8A0" opacity=".4"/>'
       +'<circle cx="100" cy="72" r="11" fill="#FFB8A0" opacity=".4"/>'
       /* arm holding brush */
       +'<rect id="brush-arm" x="92" y="58" width="14" height="38" rx="7" fill="#F5C895" transform="rotate(20 99 77)"/>'
       +'<rect x="104" y="52" width="6" height="30" rx="3" fill="#4A9438" transform="rotate(20 107 67)"/>'
       +'<rect x="108" y="48" width="18" height="6" rx="3" fill="#7DC86A" transform="rotate(20 117 51)"/>'
       +'<circle id="b-face" cx="115" cy="38" r="0" fill="none"/>'
     +'</svg>'
    +'</div>'
    /* progress */
    +'<div style="padding:0 24px;position:relative;z-index:2;flex-shrink:0;">'
     +'<div style="background:rgba(255,255,255,.1);border-radius:99px;height:8px;overflow:hidden;margin-bottom:5px;">'
       +'<div id="b-prog" style="height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#7EE8DC);transition:width .3s;"></div>'
     +'</div>'
     +'<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--text3);">'
       +'<span>Mulai</span><span id="b-cnt" style="color:var(--teal);">0/'+NEED+'</span><span>Bersih ✓</span>'
     +'</div>'
    +'</div>'
    /* SWIPE ZONE */
    +'<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:10px 24px;position:relative;z-index:2;">'
     +'<div style="width:100%;max-width:320px;">'
       /* Track box */
       +'<div id="brush-zone" style="position:relative;height:88px;border-radius:20px;'
         +'background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);'
         +'touch-action:none;cursor:grab;">'
         +'<div style="position:absolute;top:50%;left:10px;right:10px;height:3px;'
           +'background:rgba(255,255,255,.15);border-radius:99px;transform:translateY(-50%);"></div>'
         +'<div id="b-fill" style="position:absolute;top:50%;left:10px;width:0%;height:3px;'
           +'background:linear-gradient(90deg,var(--teal),transparent);transform:translateY(-50%);transition:width .08s;"></div>'
         +'<div id="b-brush" style="position:absolute;top:50%;font-size:44px;line-height:1;'
           +'transform:translateX(-50%) translateY(-50%) rotate(20deg);left:50%;'
           +'filter:drop-shadow(0 3px 12px rgba(62,207,184,.5));transition:left .1s;">'
           +'🪥'
         +'</div>'
         +'<div id="b-arrows" style="position:absolute;bottom:8px;left:0;right:0;'
           +'display:flex;justify-content:space-between;padding:0 16px;'
           +'font-size:20px;color:var(--text3);animation:pulse 1.8s infinite;pointer-events:none;">'
           +'<span>←</span><span>→</span>'
         +'</div>'
       +'</div>'
       +'<div id="b-reaction" style="text-align:center;margin-top:10px;font-size:22px;font-weight:800;'
         +'color:var(--teal);min-height:28px;"></div>'
     +'</div>'
    +'</div>'
    +'<div id="b-done" style="display:none;" class="done-banner">'
     +'<div class="done-emoji">✨😁✨</div>'
     +'<div class="done-text" style="color:var(--teal);">Gigi bersih &amp; putih!</div>'
    +'</div>';

  function toothColor(){
    var p=count/NEED;
    return 'hsl('+(190-p*190)+','+(30+p*55)+'%,'+(44+p*38)+'%)';
  }
  function refreshTeeth(){
    var c=toothColor();
    ['t0','t1','t2'].forEach(function(id){
      var el=document.getElementById(id);
      if(el)el.setAttribute('fill',c);
    });
  }

  function addStroke(dir){
    if(dir===lastDir||finished)return;
    lastDir=dir; count=Math.min(count+1,NEED); vib(35);
    document.getElementById('b-cnt').textContent=count+'/'+NEED;
    document.getElementById('b-prog').style.width=(count/NEED*100)+'%';
    document.getElementById('b-reaction').textContent=FACES[Math.min(count,6)]+' '+(count>=NEED?'Bersih!':'');
    refreshTeeth();
    if(count>=NEED&&!finished){
      finished=true; vib(100);
      document.getElementById('b-arrows').style.display='none';
      document.getElementById('b-done').style.display='block';
      setTimeout(done,1100);
    }
  }

  function moveBrush(){
    var el=document.getElementById('b-brush');
    var fill=document.getElementById('b-fill');
    if(!el||!fill)return;
    el.style.left=bx+'%';
    el.style.transform='translateX(-50%) translateY(-50%) rotate('+(bx>50?-25:25)+'deg)';
    fill.style.width=Math.max(0,bx-10)/80*100+'%';
  }

  var zone=document.getElementById('brush-zone');

  zone.addEventListener('touchstart',function(e){
    e.preventDefault();
    startX=e.touches[0].clientX;
  },{passive:false});

  zone.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(startX===null)return;
    var dx=e.touches[0].clientX-startX;
    startX=e.touches[0].clientX;
    bx=Math.max(10,Math.min(90,bx+(dx/zone.clientWidth)*110));
    moveBrush();
  },{passive:false});

  zone.addEventListener('touchend',function(e){
    e.preventDefault();
    if(startX===null)return;
    var ex=e.changedTouches[0].clientX;
    var dx=ex-startX; startX=null;
    if(Math.abs(dx)>22)addStroke(dx>0?'R':'L');
    if(!finished){bx=50;setTimeout(moveBrush,80);}
  },{passive:false});

  /* Mouse for desktop */
  var md=false,mx=0;
  zone.addEventListener('mousedown',function(e){md=true;mx=e.clientX;e.preventDefault();});
  window.addEventListener('mousemove',function(e){
    if(!md)return;
    var dx=e.clientX-mx; mx=e.clientX;
    bx=Math.max(10,Math.min(90,bx+(dx/zone.clientWidth)*110));
    moveBrush();
  });
  window.addEventListener('mouseup',function(e){
    if(!md)return;
    var dx=e.clientX-mx; md=false;
    if(Math.abs(dx)>10)addStroke(dx>0?'R':'L');
    if(!finished){bx=50;setTimeout(moveBrush,80);}
  });

  refreshTeeth();
}

           +'</div>'
         +'</div>'
         +'<div class="mattress"></div>'
         /* Blanket */
         +'<div id="blanket" class="blanket-outer" style="top:88%;">'
           +'<div class="blanket-body"><div class="blanket-pattern"></div>'
             +'<div style="position:absolute;top:14px;left:0;right:0;display:flex;'
               +'justify-content:space-evenly;font-size:11px;color:rgba(200,220,255,.2);">'
               +'<span>★</span><span>✦</span><span>★</span><span>✦</span><span>★</span><span>✦</span>'
             +'</div>'
           +'</div>'
           +'<div class="blanket-fold"><div id="bl-grip" class="blanket-grip"></div></div>'
         +'</div>'
       +'</div>'
       /* Arrow hint */
       +'<div id="bl-arrow" style="margin-top:20px;text-align:center;color:var(--text3);'
         +'font-size:13px;font-weight:800;animation:float 1.8s ease-in-out infinite;">'
         +'<div style="font-size:28px;">↑</div><div>Seret ke atas</div>'
       +'</div>'
    +'</div>';

  function updateBlanket(){
    var top=88-prog*72;
    var bl=document.getElementById('blanket');
    if(!bl)return;
    bl.style.top=top+'%';
    var face=document.getElementById('bl-face');
    if(!face)return;
    if(finished){face.textContent='😴';}
    else if(prog>.6){face.textContent='🌙';}
    else if(prog>.25){face.textContent='😌';}
    else{face.textContent='👁️';}
    if(prog>.06){
      var arrow=document.getElementById('bl-arrow');
      if(arrow)arrow.style.display='none';
    }
  }

  var zone=document.getElementById('drag-zone');

  zone.addEventListener('touchstart',function(e){
    e.preventDefault();
    startY=e.touches[0].clientY;
    startProg=prog;
  },{passive:false});

  zone.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(startY===null||finished)return;
    var dy=startY-e.touches[0].clientY;
    var H=zone.clientHeight||250;
    prog=Math.max(0,Math.min(1,startProg+dy/(H*.62)));
    var bl=document.getElementById('blanket');
    if(bl)bl.style.transition='none';
    updateBlanket();
    if(prog>=1&&!finished){
      finished=true; vib([80,40,120]);
      var bl2=document.getElementById('blanket');
      if(bl2)bl2.style.transition='top .3s ease';
      var grip=document.getElementById('bl-grip');
      if(grip)grip.style.display='none';
      var zzz=document.getElementById('zzz-zone');
      if(zzz)zzz.style.display='block';
      document.getElementById('bl-title').textContent='💤 Selamat Tidur!';
      document.getElementById('bl-hint').textContent='Baby Mo sudah tidur... 🌙';
      document.getElementById('bl-face').style.filter='drop-shadow(0 0 18px rgba(255,217,61,.5))';
      setTimeout(done,1300);
    }
  },{passive:false});

  zone.addEventListener('touchend',function(e){
    e.preventDefault();
    startY=null;
    if(!finished&&prog<.4){
      prog=0;
      var bl=document.getElementById('blanket');
      if(bl)bl.style.transition='top .4s ease';
      updateBlanket();
    }
  },{passive:false});

  /* Mouse desktop */
  var md=false,msy=0,msp=0;
  zone.addEventListener('mousedown',function(e){md=true;msy=e.clientY;msp=prog;e.preventDefault();});
  window.addEventListener('mousemove',function(e){
    if(!md||finished)return;
    var dy=msy-e.clientY;
    prog=Math.max(0,Math.min(1,msp+dy/(zone.clientHeight*.62)));
    var bl=document.getElementById('blanket');
    if(bl)bl.style.transition='none';
    updateBlanket();
    if(prog>=1&&!finished){
      finished=true; vib(100);
      setTimeout(done,1300);
    }
  });
  window.addEventListener('mouseup',function(){
    if(!md)return; md=false;
    if(!finished&&prog<.4){prog=0;updateBlanket();}
  });

  updateBlanket();
}

/* ══════════════════════════════════════════════════════
   SLEEP MODE
══════════════════════════════════════════════════════ */
function startSleep(){
  LUL.start();
  /* Viz bars */
  var viz=document.getElementById('viz');
  [2,3,5,4,7,5,4,3,5,7].forEach(function(h,i){
    var b=document.createElement('div');
    b.style.cssText='width:5px;height:'+(h*4)+'px;border-radius:99px;'
      +'background:rgba(62,207,184,'+(0.18+i*.026)+');'
      +'animation:wv '+(0.55+i*.13)+'s '+(i*.09)+'s ease-in-out infinite;'
      +'transform-origin:bottom;';
    viz.appendChild(b);
  });
  setTimeout(function(){
    document.getElementById('sleep-content').style.opacity='1';
  },600);
  /* Screen dim */
  var dim=document.getElementById('sleep-dim'), d=0;
  var iv=setInterval(function(){
    d=Math.min(d+.003,.78); dim.style.opacity=d;
    if(d>=.78)clearInterval(iv);
  },130);
}
</script>
