<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04080F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tidur Yuk!">
<link rel="manifest" href="manifest.json">
<title>Tidur Yuk! 🌙</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;}
:root{
  --bg:#04080F;--bg2:#080F1C;--surface:#0D1629;--card:#111F3A;--border:#172444;
  --blue:#4A78FF;--blue-soft:#7EA5FF;--teal:#3ECFB8;--teal-soft:#6EE7D4;
  --gold:#FFD166;--purple:#A97FFF;--text:#B8CCEE;--text2:#5A7099;--text3:#2C3F60;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body,#root{width:100%;height:100%;overflow:hidden;position:fixed;inset:0;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;}
#root{display:flex;flex-direction:column;}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.9;transform:scale(1.3)}}
@keyframes moonFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
@keyframes moonGlow{0%,100%{filter:drop-shadow(0 0 14px rgba(255,209,102,.35))}50%{filter:drop-shadow(0 0 40px rgba(255,209,102,.75))}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{0%{opacity:0;transform:scale(.25) rotate(-18deg)}55%{transform:scale(1.2) rotate(6deg)}80%{transform:scale(.92) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes ringPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1.25)}}
@keyframes floatUp{0%{opacity:.6;transform:translateY(0)}100%{opacity:0;transform:translateY(-44px)}}
@keyframes checkPop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shine{0%,100%{background-position:200% center}50%{background-position:-200% center}}
@keyframes starDrift{from{transform:translateY(0)}to{transform:translateY(-16px)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback,useMemo,memo}=React;

function vibrate(ms=40){try{navigator.vibrate?.(ms);}catch(e){}}
function speak(text){
  try{window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ar-SA';u.rate=.5;u.pitch=1.1;u.volume=1;
    window.speechSynthesis.speak(u);}catch(e){}
}

/* THE KEY FIX: attach touch events directly to DOM with passive:false
   React synthetic touch events are passive by default in modern browsers,
   so e.preventDefault() is silently ignored and the browser scroll wins.
   We bypass React for all swipe/drag interactions.                      */
function useNativeTouch(ref, {onStart,onMove,onEnd}, deps=[]){
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const o={passive:false};
    if(onStart) el.addEventListener('touchstart',onStart,o);
    if(onMove)  el.addEventListener('touchmove', onMove, o);
    if(onEnd)   el.addEventListener('touchend',  onEnd,  o);
    return()=>{
      if(onStart) el.removeEventListener('touchstart',onStart);
      if(onMove)  el.removeEventListener('touchmove', onMove);
      if(onEnd)   el.removeEventListener('touchend',  onEnd);
    };
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[ref.current,...deps]);
}

const Lullaby=(()=>{
  let ctx=null,gain=null,active=false,timer=null,next=0,idx=0;
  const N=[[196,.7],[220,.7],[247,.5],[196,.2],[220,.8],[294,.7],[330,.5],[294,.2],
           [220,.7],[196,.5],[247,.3],[196,.2],[165,1.2],[0,.4],[196,.6],[220,.6],
           [247,.4],[294,.6],[330,.8],[294,.5],[247,.5],[220,.5],[196,1.5],[0,.8]];
  function note(f,t,d){
    if(!f||!gain)return;
    const o=ctx.createOscillator(),e=ctx.createGain(),fl=ctx.createBiquadFilter();
    fl.type='lowpass';fl.frequency.value=500;o.type='sine';o.frequency.value=f;
    o.connect(fl);fl.connect(e);e.connect(gain);
    e.gain.setValueAtTime(0,t);
    e.gain.linearRampToValueAtTime(.6,t+Math.min(.06,d*.12));
    e.gain.exponentialRampToValueAtTime(.001,t+d-.04);
    o.start(t);o.stop(t+d);
  }
  function tick(){
    while(next<ctx.currentTime+.6){const[f,d]=N[idx%N.length];note(f,next,d);next+=d;idx++;}
    if(active)timer=setTimeout(tick,200);
  }
  return{
    start(){if(active)return;try{
      ctx=new(window.AudioContext||window.webkitAudioContext)();
      gain=ctx.createGain();gain.gain.setValueAtTime(0,ctx.currentTime);
      gain.gain.linearRampToValueAtTime(.2,ctx.currentTime+5);
      gain.connect(ctx.destination);next=ctx.currentTime+1;idx=0;active=true;tick();
    }catch(e){}},
    stop(){active=false;clearTimeout(timer);
      if(gain&&ctx){gain.gain.linearRampToValueAtTime(0,ctx.currentTime+2.5);
        setTimeout(()=>{try{ctx.close();}catch(e){}ctx=null;},3200);}},
  };
})();

const STEPS=[
  {id:'brush',  label:'Gosok Gigi',emoji:'🪥',color:'#3ECFB8'},
  {id:'pajamas',label:'Ganti Baju', emoji:'👕',color:'#A97FFF'},
  {id:'doa',    label:'Baca Doa',  emoji:'🤲',color:'#FFD166'},
  {id:'tidur',  label:'Tidur',     emoji:'💤',color:'#4A78FF'},
];
const PJ=[
  {id:'shirt', emoji:'👕',label:'Baju tidur',  color:'#A97FFF'},
  {id:'pants', emoji:'🩲',label:'Celana tidur', color:'#7EA5FF'},
  {id:'boneka',emoji:'🧸',label:'Boneka',        color:'#FFD166'},
];
const DOA=[
  {arabic:'بِسْمِكَ اللَّهُمَّ',latin:'Bismika Allāhumma',mean:'Dengan nama-Mu ya Allah',speech:'بسمك اللهم',color:'#FFD166'},
  {arabic:'أَحْيَا وَأَمُوتُ',latin:'ahyā wa amūtu',mean:'aku hidup dan aku mati',speech:'أحيا وأموت',color:'#A97FFF'},
];

const StarField=memo(({count=55,drift=false})=>{
  const stars=useMemo(()=>Array.from({length:count},(_,id)=>({
    id,x:Math.random()*100,y:Math.random()*100,s:.6+Math.random()*2.2,
    dur:2+Math.random()*4,delay:Math.random()*5,op:.15+Math.random()*.85})),[count]);
  return(<div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none',zIndex:0}}>
    {stars.map(({id,x,y,s,dur,delay,op})=>(
      <div key={id} style={{position:'absolute',left:x+'%',top:y+'%',width:s+'px',height:s+'px',
        borderRadius:'50%',background:'#D4E8FF',opacity:op,
        animation:`twinkle ${dur}s ${delay}s infinite ease-in-out`
          +(drift?`, starDrift ${7+dur}s ${delay}s infinite alternate ease-in-out`:'')}}/>
    ))}
  </div>);
});

function StepDots({current}){
  return(<div style={{display:'flex',gap:7,justifyContent:'center',
    paddingTop:`calc(14px + var(--safe-top))`,paddingBottom:4,position:'relative',zIndex:2}}>
    {STEPS.map(({id,color},i)=>{const done=i<current,active=i===current;
      return(<div key={id} style={{height:8,borderRadius:99,width:active?28:8,
        background:done?color:active?'#7EA5FF':'var(--border)',
        transition:'all .45s cubic-bezier(.34,1.56,.64,1)',
        boxShadow:active?`0 0 12px ${color}90`:'none'}}/>);
    })}
  </div>);
}

function StepHeader({idx,title,subtitle}){
  return(<div style={{padding:'16px 28px 0',textAlign:'center',position:'relative',zIndex:2}}>
    <div style={{fontSize:11,fontWeight:800,color:'var(--text3)',letterSpacing:2.5,
      textTransform:'uppercase',marginBottom:5}}>Langkah {idx+1} dari {STEPS.length}</div>
    <div style={{fontFamily:"'Baloo 2',cursive",fontSize:24,fontWeight:800,
      color:'var(--text)',lineHeight:1.2,marginBottom:4}}>{STEPS[idx].emoji}&nbsp;{title}</div>
    <div style={{fontSize:14,color:'var(--text2)',lineHeight:1.5}}>{subtitle}</div>
  </div>);
}

function FadeIn({children}){
  const[vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),40);return()=>clearTimeout(t);},[]);
  return(<div style={{flex:1,display:'flex',flexDirection:'column',opacity:vis?1:0,
    transform:vis?'none':'translateY(26px)',transition:'all .55s cubic-bezier(.34,1.56,.64,1)'}}>
    {children}</div>);
}

/* ── STEP 1: BRUSH TEETH ── */
function BrushTeeth({onComplete}){
  const NEEDED=7;
  const[strokes,setStrokes]=useState(0);
  const[brushX,setBrushX]=useState(50);
  const[done,setDone]=useState(false);
  const[face,setFace]=useState('😐');
  const[gleam,setGleam]=useState(false);
  const trackRef=useRef(null);
  const S=useRef({strokes:0,done:false,lastDir:null,startX:null});
  const FACES=['😐','🙂','😊','😄','🤩','⭐','😁'];
  useEffect(()=>{S.current.strokes=strokes;},[strokes]);
  useEffect(()=>{S.current.done=done;},[done]);
  useEffect(()=>{if(strokes>=NEEDED&&!done){setDone(true);vibrate(100);setTimeout(onComplete,1000);}},[strokes,done,onComplete]);

  useEffect(()=>{
    const el=trackRef.current; if(!el)return;
    function onStart(e){e.preventDefault();S.current.startX=e.touches[0].clientX;}
    function onMove(e){
      e.preventDefault();
      if(S.current.startX===null)return;
      const dx=e.touches[0].clientX-S.current.startX;
      S.current.startX=e.touches[0].clientX;
      setBrushX(p=>Math.max(8,Math.min(92,p+(dx/(el.clientWidth||280))*100)));
    }
    function onEnd(e){
      e.preventDefault();
      if(S.current.startX===null)return;
      const dx=e.changedTouches[0].clientX-S.current.startX;
      S.current.startX=null;
      if(S.current.done){setBrushX(50);return;}
      if(Math.abs(dx)>28){
        const dir=dx>0?'R':'L';
        if(dir!==S.current.lastDir){
          S.current.lastDir=dir; vibrate(35);
          setStrokes(s=>{const n=Math.min(s+1,NEEDED);
            setFace(FACES[Math.min(n,6)]);setGleam(true);
            setTimeout(()=>setGleam(false),350);return n;});
        }
      }
      if(!S.current.done)setBrushX(50);
    }
    const o={passive:false};
    el.addEventListener('touchstart',onStart,o);
    el.addEventListener('touchmove',onMove,o);
    el.addEventListener('touchend',onEnd,o);
    return()=>{el.removeEventListener('touchstart',onStart);
      el.removeEventListener('touchmove',onMove);el.removeEventListener('touchend',onEnd);};
  },[onComplete]);

  const prog=Math.min(strokes/NEEDED,1);
  const tw=`hsl(${200-prog*200},${20+prog*60}%,${52+prog*32}%)`;
  return(<FadeIn>
    <StepHeader idx={0} title="Gosok Gigi" subtitle="Geser kiri–kanan untuk menyikat gigi 🪥"/>
    <div style={{padding:'14px 28px 0',zIndex:2,position:'relative'}}>
      <div style={{background:'var(--border)',borderRadius:99,height:7,overflow:'hidden'}}>
        <div style={{height:'100%',width:(prog*100)+'%',borderRadius:99,
          background:'linear-gradient(90deg,var(--teal),var(--teal-soft))',transition:'width .35s ease'}}/>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',marginTop:5,
        fontSize:11,fontWeight:700,color:'var(--text3)'}}>
        <span>Mulai</span><span style={{color:'var(--teal)'}}>{strokes}/{NEEDED} usapan</span><span>Bersih ✓</span>
      </div>
    </div>
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
      padding:'14px 28px',zIndex:2,position:'relative'}}>
      <div style={{width:'100%',maxWidth:310}}>
        <div style={{background:'#180808',borderRadius:'35% 35% 52% 52% / 25% 25% 50% 50%',
          padding:'10px 16px 26px',border:'2.5px solid #2a1212',position:'relative',overflow:'hidden',marginBottom:8}}>
          <div style={{height:5,marginBottom:5}}/>
          <div style={{display:'flex',gap:3,justifyContent:'center',marginBottom:3}}>
            {[0,1,2,3,4,5].map(i=>(
              <div key={i} style={{flex:1,maxWidth:38,height:42,borderRadius:'5px 5px 10px 10px',
                background:tw,transition:'background .4s ease',
                backgroundImage:gleam?'linear-gradient(110deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%)':'none',
                backgroundSize:'200% 100%',animation:gleam?'shine .35s ease':'none',
                boxShadow:gleam?`0 0 14px ${tw}80`:'none'}}/>
            ))}
          </div>
          <div style={{height:4,background:'rgba(160,30,30,.45)',borderRadius:4,marginBottom:3}}/>
          <div style={{display:'flex',gap:3,justifyContent:'center'}}>
            {[0,1,2,3,4].map(i=>(
              <div key={i} style={{flex:1,maxWidth:30,height:24,borderRadius:'10px 10px 5px 5px',
                background:`hsl(200,${15+prog*40}%,${42+prog*20}%)`,transition:'background .4s ease'}}/>
            ))}
          </div>
          <div style={{position:'absolute',top:8,right:12,fontSize:22,
            animation:'bounceIn .35s cubic-bezier(.34,1.56,.64,1)'}}>{face}</div>
        </div>
        <div ref={trackRef} style={{position:'relative',height:80,touchAction:'none',
          cursor:'grab',background:'transparent',borderRadius:16}}>
          <div style={{position:'absolute',top:'50%',left:0,right:0,height:2,
            background:'var(--border)',borderRadius:99,transform:'translateY(-50%)'}}/>
          <div style={{position:'absolute',top:'50%',left:'8%',
            width:((Math.max(0,brushX-8))/84*100)+'%',height:2,
            background:'linear-gradient(90deg,var(--teal),transparent)',transform:'translateY(-50%)'}}/>
          <div style={{position:'absolute',left:brushX+'%',top:'50%',
            transform:`translateX(-50%) translateY(-50%) rotate(${brushX>50?-22:22}deg)`,
            fontSize:40,lineHeight:1,filter:'drop-shadow(0 2px 10px rgba(62,207,184,.5))',
            transition:'left .12s ease'}}>🪥</div>
          {strokes===0&&(<div style={{position:'absolute',bottom:4,left:0,right:0,
            display:'flex',justifyContent:'space-between',padding:'0 10px',fontSize:22,
            color:'var(--text3)',animation:'breathe 1.6s infinite',pointerEvents:'none'}}>
            <span>←</span><span>→</span></div>)}
        </div>
      </div>
    </div>
    {done&&(<div style={{textAlign:'center',padding:'0 28px',
      paddingBottom:`calc(24px + var(--safe-bot))`,zIndex:2,position:'relative',animation:'fadeUp .5s ease'}}>
      <div style={{fontSize:38,marginBottom:4}}>✨✨✨</div>
      <div style={{fontFamily:"'Baloo 2',cursive",fontSize:22,fontWeight:800,color:'var(--teal)'}}>
        Gigi bersih &amp; putih!</div></div>)}
  </FadeIn>);
}

/* ── STEP 2: PAJAMAS ── */
function PajamasStep({onComplete}){
  const[done,setDone]=useState(new Set());
  const[ripples,setRipples]=useState({});
  const complete=done.size>=PJ.length;
  useEffect(()=>{if(complete){vibrate(100);setTimeout(onComplete,800);}},[complete,onComplete]);
  const tap=useCallback((id,e)=>{
    if(done.has(id))return; vibrate(40);
    const rect=e.currentTarget.getBoundingClientRect();
    const t=e.changedTouches?.[0]||e;
    setRipples(r=>({...r,[id]:{x:(t.clientX-rect.left)/rect.width*100,y:(t.clientY-rect.top)/rect.height*100}}));
    setTimeout(()=>setRipples(r=>{const n={...r};delete n[id];return n;}),600);
    setDone(p=>new Set([...p,id]));
  },[done]);
  return(<FadeIn>
    <StepHeader idx={1} title="Ganti Baju" subtitle="Ketuk setiap baju untuk memakainya"/>
    <div style={{display:'flex',justifyContent:'center',padding:'14px 0 4px',zIndex:2,position:'relative'}}>
      <div style={{width:68,height:68,borderRadius:'50%',background:'var(--card)',
        border:'2px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:36,
        boxShadow:complete?'0 0 28px rgba(169,127,255,.4)':'none',transition:'box-shadow .6s ease'}}>
        {complete?'🌙':'👤'}</div>
    </div>
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
      padding:'10px 24px',zIndex:2,position:'relative'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,width:'100%',maxWidth:320}}>
        {PJ.map(({id,emoji,label,color},i)=>{
          const isDone=done.has(id),rip=ripples[id];
          return(<div key={id} onTouchEnd={e=>tap(id,e)} onClick={e=>tap(id,e)}
            style={{gridColumn:i===2?'1/-1':'auto',
              background:isDone?`${color}18`:'var(--card)',
              border:`2px solid ${isDone?color:'var(--border)'}`,
              borderRadius:22,padding:'20px 12px',textAlign:'center',
              cursor:isDone?'default':'pointer',position:'relative',overflow:'hidden',
              transform:isDone?'scale(.97)':'scale(1)',
              transition:'all .4s cubic-bezier(.34,1.56,.64,1)',touchAction:'manipulation'}}>
            {rip&&(<div style={{position:'absolute',left:rip.x+'%',top:rip.y+'%',
              width:10,height:10,marginLeft:-5,marginTop:-5,borderRadius:'50%',
              background:color,opacity:.5,animation:'ringPulse .6s ease forwards',pointerEvents:'none'}}/>)}
            {!isDone&&(<div style={{position:'absolute',inset:0,borderRadius:21,
              border:`1px solid ${color}25`,animation:'breathe 2.2s infinite'}}/>)}
            <div style={{fontSize:50,marginBottom:8,lineHeight:1,
              animation:isDone?'bounceIn .5s cubic-bezier(.34,1.56,.64,1)':'none',
              filter:isDone?`drop-shadow(0 0 14px ${color}80)`:'none',transition:'filter .3s'}}>
              {isDone?'✅':emoji}</div>
            <div style={{fontSize:13,fontWeight:700,color:isDone?color:'var(--text2)',transition:'color .3s'}}>
              {isDone?'Sudah! ✓':label}</div>
          </div>);
        })}
      </div>
    </div>
    {complete&&(<div style={{textAlign:'center',padding:'0 28px',
      paddingBottom:`calc(24px + var(--safe-bot))`,zIndex:2,position:'relative',animation:'fadeUp .5s ease'}}>
      <div style={{fontFamily:"'Baloo 2',cursive",fontSize:22,fontWeight:800,color:'#A97FFF'}}>
        Siap untuk tidur! 🌙</div></div>)}
  </FadeIn>);
}

/* ── STEP 3: DOA ── */
function DoaStep({onComplete}){
  const[tapped,setTapped]=useState(new Set());
  const[playing,setPlaying]=useState(null);
  const complete=tapped.size>=DOA.length;
  useEffect(()=>{if(complete){vibrate(100);setTimeout(onComplete,1100);}},[complete,onComplete]);
  const tap=useCallback(i=>{
    if(tapped.has(i)||playing!==null)return;
    if(i>0&&!tapped.has(i-1))return;
    vibrate(40); setPlaying(i); speak(DOA[i].speech);
    setTimeout(()=>{setTapped(p=>new Set([...p,i]));setPlaying(null);},1700);
  },[tapped,playing]);
  return(<FadeIn>
    <StepHeader idx={2} title="Baca Doa" subtitle="Ketuk setiap baris doa"/>
    <div style={{flex:1,display:'flex',flexDirection:'column',justifyContent:'center',
      padding:'12px 24px',gap:12,zIndex:2,position:'relative'}}>
      <div style={{textAlign:'center',marginBottom:4}}>
        <span style={{display:'inline-flex',alignItems:'center',gap:8,
          background:'rgba(255,209,102,.1)',border:'1px solid rgba(255,209,102,.2)',
          borderRadius:99,padding:'6px 18px',fontSize:11,fontWeight:800,
          color:'rgba(255,209,102,.8)',letterSpacing:1.5,textTransform:'uppercase'}}>
          🌙 Doa Sebelum Tidur</span>
      </div>
      {DOA.map(({arabic,latin,mean,color},i)=>{
        const isDone=tapped.has(i),isActive=playing===i,locked=i>0&&!tapped.has(i-1);
        return(<div key={i} onTouchEnd={()=>tap(i)} onClick={()=>tap(i)}
          style={{background:isDone?`${color}18`:isActive?`${color}12`:'var(--card)',
            border:`2px solid ${isDone?color:isActive?color+'88':'var(--border)'}`,
            borderRadius:20,padding:'18px 20px',cursor:locked?'default':'pointer',
            opacity:locked?.32:1,position:'relative',overflow:'hidden',
            transition:'all .35s cubic-bezier(.34,1.56,.64,1)',touchAction:'manipulation'}}>
          {isActive&&(<div style={{position:'absolute',inset:0,
            background:`radial-gradient(circle at 50% 50%,${color}20 0%,transparent 70%)`,
            animation:'breathe .6s infinite'}}/>)}
          <div style={{fontSize:28,fontFamily:'serif',fontWeight:700,textAlign:'right',
            direction:'rtl',lineHeight:1.9,color:isDone?color:isActive?color:'var(--text)',
            textShadow:isDone?`0 0 22px ${color}60`:'none',transition:'all .3s'}}>
            {arabic}</div>
          <div style={{fontSize:13,fontWeight:600,color:'var(--text2)',marginTop:3,fontStyle:'italic'}}>{latin}</div>
          <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>{mean}</div>
          <div style={{position:'absolute',top:14,right:16,fontSize:20,
            animation:isDone?'checkPop .5s cubic-bezier(.34,1.56,.64,1)':'none'}}>
            {isDone?'✅':isActive?'🔊':locked?'🔒':'👆'}</div>
        </div>);
      })}
      {playing!==null&&(<div style={{display:'flex',gap:4,justifyContent:'center',alignItems:'flex-end',height:28}}>
        {[2,3,5,4,6,4,3,2,4,5].map((h,i)=>(
          <div key={i} style={{width:4,height:h*4+'px',background:'rgba(255,209,102,.6)',borderRadius:99,
            animation:`wave ${.4+i*.1}s ${i*.06}s ease-in-out infinite`,transformOrigin:'bottom'}}/>
        ))}</div>)}
    </div>
    {complete&&(<div style={{textAlign:'center',padding:'4px 28px',
      paddingBottom:`calc(20px + var(--safe-bot))`,zIndex:2,position:'relative',animation:'fadeUp .5s ease'}}>
      <div style={{fontSize:32,marginBottom:4}}>🤲</div>
      <div style={{fontFamily:"'Baloo 2',cursive",fontSize:24,fontWeight:800,color:'var(--gold)'}}>Aamiin...</div>
    </div>)}
  </FadeIn>);
}

/* ── STEP 4: DRAG BLANKET ── */
function SleepDrag({onComplete}){
  const[prog,setProg]=useState(0);
  const[done,setDone]=useState(false);
  const bedRef=useRef(null);
  const S=useRef({startY:null,startProg:0,done:false});
  useEffect(()=>{S.current.done=done;},[done]);
  useEffect(()=>{if(done){vibrate(120);setTimeout(onComplete,1200);}},[done,onComplete]);

  useEffect(()=>{
    const el=bedRef.current; if(!el)return;
    function onStart(e){e.preventDefault();S.current.startY=e.touches[0].clientY;S.current.startProg=prog;}
    function onMove(e){
      e.preventDefault();
      if(S.current.startY===null||S.current.done)return;
      const dy=S.current.startY-e.touches[0].clientY;
      const p=Math.max(0,Math.min(1,S.current.startProg+dy/((el.clientHeight||260)*.6)));
      setProg(p);
      if(p>=1&&!S.current.done){S.current.done=true;setDone(true);}
    }
    function onEnd(e){
      e.preventDefault(); S.current.startY=null;
      if(!S.current.done) setProg(p=>p<.45?0:p);
    }
    const o={passive:false};
    el.addEventListener('touchstart',onStart,o);
    el.addEventListener('touchmove',onMove,o);
    el.addEventListener('touchend',onEnd,o);
    return()=>{el.removeEventListener('touchstart',onStart);
      el.removeEventListener('touchmove',onMove);el.removeEventListener('touchend',onEnd);};
  },[onComplete]);

  const blanketTop=86-prog*68;
  const face=done?'😴':prog>.55?'🌙':prog>.2?'😌':'👁️';
  return(<FadeIn>
    <StepHeader idx={3} title="Tarik Selimut"
      subtitle={done?'Selamat tidur! 💤':'Seret ke atas untuk menarik selimut'}/>
    <div ref={bedRef} style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',
      padding:'14px 32px',touchAction:'none',zIndex:2,position:'relative'}}>
      <div style={{width:'100%',maxWidth:290,position:'relative'}}>
        <div style={{background:'var(--card)',border:'2px solid var(--border)',
          borderRadius:24,overflow:'hidden',position:'relative',height:250}}>
          <div style={{position:'absolute',top:0,left:0,right:0,height:18,
            background:'var(--border)',borderRadius:'22px 22px 0 0'}}/>
          <div style={{position:'absolute',top:24,left:14,right:14,height:62,
            background:'rgba(255,255,255,.055)',border:'1.5px solid rgba(255,255,255,.1)',
            borderRadius:16,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{fontSize:48,transition:'all .5s ease',
              filter:done?'drop-shadow(0 0 20px rgba(255,209,102,.55))':'none'}}>{face}</div>
            {done&&[0,1,2].map(j=>(<div key={j} style={{position:'absolute',
              right:(18+j*16)+'px',top:(2-j*7)+'px',fontSize:(12+j*5)+'px',
              fontWeight:800,fontFamily:"'Baloo 2',cursive",
              color:`rgba(100,180,255,${.35+j*.15})`,
              animation:`floatUp ${1.4+j*.4}s ${j*.35}s ease infinite`}}>Z</div>))}
          </div>
          <div style={{position:'absolute',bottom:0,left:0,right:0,height:'55%',background:'var(--surface)'}}/>
          <div style={{position:'absolute',left:0,right:0,bottom:0,top:blanketTop+'%',
            transition:S.current.startY?'none':'top .3s ease'}}>
            <div style={{position:'absolute',inset:0,
              background:'linear-gradient(160deg,#1A3060 0%,#142850 30%,#1E376A 60%,#142850 100%)',overflow:'hidden'}}>
              <div style={{position:'absolute',inset:0,backgroundImage:'repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0px,rgba(255,255,255,.025) 12px,transparent 12px,transparent 24px)'}}/>
              <div style={{position:'absolute',top:14,left:0,right:0,display:'flex',
                justifyContent:'space-evenly',fontSize:10,color:'rgba(180,200,255,.18)'}}>
                {['★','✦','★','✦','★','✦','★'].map((s,i)=><span key={i}>{s}</span>)}
              </div>
            </div>
            <div style={{position:'absolute',top:0,left:0,right:0,height:18,
              background:'linear-gradient(135deg,#2A50A0,#1E3A80)',borderRadius:'2px 2px 0 0',
              borderBottom:'1px solid rgba(255,255,255,.08)'}}>
              {!done&&(<div style={{position:'absolute',top:'50%',left:'50%',
                transform:'translate(-50%,-50%)',width:46,height:5,borderRadius:99,
                background:'rgba(126,165,255,.55)',boxShadow:'0 0 12px rgba(126,165,255,.4)'}}/>)}
            </div>
          </div>
        </div>
        {!done&&prog<.1&&(<div style={{position:'absolute',bottom:-38,left:'50%',
          transform:'translateX(-50%)',textAlign:'center',color:'var(--text3)',
          fontSize:13,fontWeight:700,animation:'floatUp 1.7s ease infinite',pointerEvents:'none'}}>
          <div style={{fontSize:22,marginBottom:2}}>↑</div><div>Seret ke atas</div>
        </div>)}
      </div>
    </div>
  </FadeIn>);
}

/* ── SLEEP MODE ── */
function SleepMode(){
  const[dim,setDim]=useState(0);
  const[vis,setVis]=useState(false);
  useEffect(()=>{
    Lullaby.start(); setTimeout(()=>setVis(true),700);
    let d=0; const iv=setInterval(()=>{d=Math.min(d+.0028,.74);setDim(d);},130);
    return()=>{clearInterval(iv);Lullaby.stop();};
  },[]);
  return(<div style={{position:'absolute',inset:0,overflow:'hidden',
    background:'linear-gradient(170deg,#02040A 0%,#030710 100%)'}}>
    <StarField count={90} drift/>
    <div style={{position:'absolute',inset:0,background:'#000',opacity:dim,
      pointerEvents:'none',zIndex:2,transition:'opacity .5s ease'}}/>
    <div style={{position:'absolute',inset:0,zIndex:3,display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',gap:12,opacity:vis?1:0,transition:'opacity .9s ease'}}>
      <div style={{fontSize:100,lineHeight:1,
        animation:'moonFloat 4.5s ease-in-out infinite, moonGlow 3.5s ease-in-out infinite',marginBottom:10}}>🌙</div>
      <div style={{fontFamily:"'Baloo 2',cursive",fontSize:28,fontWeight:800,
        color:'rgba(180,205,245,.6)',textAlign:'center',letterSpacing:.5}}>Selamat tidur...</div>
      <div style={{fontSize:15,color:'rgba(90,112,160,.5)',fontStyle:'italic',textAlign:'center'}}>Mimpi yang indah ya 💫</div>
      <div style={{display:'flex',gap:14,marginTop:4}}>
        {['Z','Z','Z'].map((z,i)=>(<div key={i} style={{fontSize:(18+i*8)+'px',fontWeight:900,
          fontFamily:"'Baloo 2',cursive",color:`rgba(74,120,255,${.18+i*.14})`,
          animation:`floatUp ${1.6+i*.5}s ${i*.4}s ease infinite`}}>{z}</div>))}
      </div>
      <div style={{display:'flex',gap:5,alignItems:'flex-end',height:34,marginTop:10}}>
        {[2,3,5,4,7,5,4,3,5,6].map((h,i)=>(<div key={i} style={{width:4,
          background:`rgba(62,207,184,${.18+i*.028})`,borderRadius:99,height:h*4+'px',
          animation:`wave ${.5+i*.12}s ${i*.08}s ease-in-out infinite`,transformOrigin:'bottom'}}/>))}
      </div>
    </div>
  </div>);
}

/* ── STEP FLOW ── */
function StepFlow({onDone}){
  const[step,setStep]=useState(0);
  const[leaving,setLeaving]=useState(false);
  const advance=useCallback(()=>{
    if(step<STEPS.length-1){setLeaving(true);setTimeout(()=>{setStep(s=>s+1);setLeaving(false);},360);}
    else onDone();
  },[step,onDone]);
  const comps=[
    <BrushTeeth  key="b" onComplete={advance}/>,
    <PajamasStep key="p" onComplete={advance}/>,
    <DoaStep     key="d" onComplete={advance}/>,
    <SleepDrag   key="s" onComplete={advance}/>,
  ];
  return(<div style={{height:'100%',display:'flex',flexDirection:'column',
    background:'linear-gradient(170deg,#04080F 0%,#080F1C 60%,#0A1228 100%)',position:'relative'}}>
    <StarField count={38}/>
    <div style={{position:'relative',zIndex:1,display:'flex',flexDirection:'column',height:'100%',
      opacity:leaving?0:1,transform:leaving?'translateY(-18px)':'none',transition:'all .36s ease'}}>
      <StepDots current={step}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',
        paddingBottom:`calc(16px + var(--safe-bot))`}}>{comps[step]}</div>
    </div>
  </div>);
}

/* ── HOME ── */
function HomeScreen({onStart}){
  const[vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),90);return()=>clearTimeout(t);},[]);
  return(<div style={{height:'100%',
    background:'linear-gradient(170deg,#04080F 0%,#060C18 45%,#08101E 100%)',
    display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
    position:'relative',overflow:'hidden'}}>
    <StarField count={70}/>
    <div style={{position:'absolute',bottom:0,left:0,right:0,height:'38%',
      background:'radial-gradient(ellipse 80% 60% at 50% 120%,rgba(12,30,70,.55) 0%,transparent 70%)',pointerEvents:'none'}}/>
    <div style={{position:'relative',zIndex:2,textAlign:'center',
      padding:`calc(28px + var(--safe-top)) 36px calc(28px + var(--safe-bot))`,
      opacity:vis?1:0,transform:vis?'none':'translateY(30px)',
      transition:'all .9s cubic-bezier(.34,1.56,.64,1)'}}>
      <div style={{fontSize:100,lineHeight:1,marginBottom:24,
        animation:'moonFloat 4.5s ease-in-out infinite, moonGlow 3.5s ease-in-out infinite'}}>🌙</div>
      <div style={{fontSize:11,fontWeight:800,letterSpacing:3,textTransform:'uppercase',
        color:'var(--text3)',marginBottom:10}}>Baby Mo · Ritual Malam</div>
      <h1 style={{fontFamily:"'Baloo 2',cursive",fontSize:40,fontWeight:800,lineHeight:1.15,
        color:'var(--text)',marginBottom:10,letterSpacing:-.5}}>Waktunya<br/>Tidur! ✨</h1>
      <p style={{fontSize:15,color:'var(--text2)',lineHeight:1.6,maxWidth:260,margin:'0 auto 44px'}}>
        Yuk ikuti 4 langkah malam<br/>bersama Baby Mo 🌟</p>
      <button onClick={()=>{vibrate(60);onStart();}}
        style={{background:'linear-gradient(135deg,#3A64F0,#6B94FF)',border:'none',
          borderRadius:100,padding:'19px 52px',fontFamily:"'Nunito',sans-serif",
          fontSize:19,fontWeight:900,color:'#fff',cursor:'pointer',display:'block',margin:'0 auto',
          boxShadow:'0 8px 36px rgba(74,120,255,.4),0 2px 8px rgba(0,0,0,.4)',
          animation:'breathe 2.8s ease-in-out infinite',WebkitTapHighlightColor:'transparent',
          touchAction:'manipulation'}}>Mulai Tidur 🌙</button>
      <div style={{display:'flex',gap:22,justifyContent:'center',marginTop:38}}>
        {STEPS.map(({id,emoji,label},i)=>(
          <div key={id} style={{textAlign:'center',opacity:.45,animation:`fadeUp .5s ${.15+i*.1}s ease both`}}>
            <div style={{fontSize:24,marginBottom:4}}>{emoji}</div>
            <div style={{fontSize:10,fontWeight:700,color:'var(--text3)',letterSpacing:.5}}>{label}</div>
          </div>
        ))}
      </div>
    </div>
  </div>);
}

/* ── APP ROOT ── */
function Fade({children}){
  const[vis,setVis]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVis(true),40);return()=>clearTimeout(t);},[]);
  return(<div style={{position:'absolute',inset:0,opacity:vis?1:0,transition:'opacity .45s ease'}}>{children}</div>);
}
function App(){
  const[screen,setScreen]=useState('home');
  return(<div style={{width:'100%',height:'100%',position:'relative',overflow:'hidden'}}>
    {screen==='home' &&<Fade key="h"><HomeScreen onStart={()=>setScreen('steps')}/></Fade>}
    {screen==='steps'&&<Fade key="s"><StepFlow   onDone={()=>setScreen('sleep')}/></Fade>}
    {screen==='sleep'&&<Fade key="z"><SleepMode/></Fade>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
