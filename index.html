<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Baby Mo 🌙</title>
<style>
/* ── TOKENS ── */
:root{
  --navy:#0A1628;--navy2:#0F2044;--card:#162A56;--card2:#1A3266;
  --gold:#FFD93D;--gold2:#F4A832;--green:#4EC94C;
  --teal:#3ECFB8;--purple:#A97FFF;--blue:#7EA5FF;
  --text:#FFFFFF;--text2:#A8C4E8;--text3:#5A7AAA;
}
/* ── RESET ── */
*{margin:0;padding:0;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;}
html,body{
  width:100%;height:100%;
  overflow:hidden;position:fixed;inset:0;
  background:var(--navy);
  font-family:'Nunito','Arial Rounded MT Bold',Arial,sans-serif;
}
/* ── SCREENS ── */
.scr{display:none;position:fixed;inset:0;}
.scr.on{display:flex;flex-direction:column;}
/* ── ANIMS ── */
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:.95;transform:scale(1.4)}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes su{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes pk{0%{transform:scale(0) rotate(-15deg);opacity:0}65%{transform:scale(1.18) rotate(5deg)}100%{transform:scale(1);opacity:1}}
@keyframes rp{to{transform:scale(5);opacity:0}}
@keyframes wv{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes zf{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-38px)}}
@keyframes bth{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
/* ── PROGRESS BAR ── */
.topbar{display:flex;align-items:center;gap:12px;padding:16px 22px 4px;flex-shrink:0;}
.ptrack{flex:1;height:12px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.pfill{height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--green),#8EF08C);
  transition:width .6s cubic-bezier(.34,1.56,.64,1);width:0%;}
/* ── STEP HEADER ── */
.shead{text-align:center;padding:10px 24px 0;flex-shrink:0;}
.snum{font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
.stitle{font-size:27px;font-weight:900;color:white;line-height:1.2;}
.shint{font-size:14px;color:var(--text2);margin-top:5px;line-height:1.4;}
/* ── GOLD BUTTON ── */
.gbtn{
  background:linear-gradient(135deg,#FFD93D,#F4A832);
  border:none;border-radius:100px;padding:18px 48px;
  font-family:inherit;font-size:20px;font-weight:900;color:#0A1628;
  cursor:pointer;display:inline-flex;align-items:center;gap:10px;
  box-shadow:0 6px 28px rgba(255,217,61,.45);
  animation:pu 2.5s ease-in-out infinite;
  touch-action:manipulation;
}
/* ── PJ ITEMS ── */
.pjgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:330px;}
.pjitem{
  background:rgba(255,255,255,.07);border:2.5px solid rgba(255,255,255,.12);
  border-radius:24px;padding:22px 14px;text-align:center;
  cursor:pointer;position:relative;overflow:hidden;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);
  touch-action:manipulation;
}
/* ── DUA LINES ── */
.dualine{
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);
  border-radius:20px;padding:18px 20px;cursor:pointer;
  position:relative;overflow:hidden;
  transition:all .35s cubic-bezier(.34,1.56,.64,1);
  touch-action:manipulation;margin-bottom:11px;
}
.dualine.locked{opacity:.28;cursor:default;pointer-events:none;}
.dualine.active{border-color:rgba(255,217,61,.7);background:rgba(255,217,61,.1);}
.dualine.finished{border-color:rgba(78,201,76,.6);background:rgba(78,201,76,.09);}
/* ── BED ── */
.bedframe{
  background:var(--card);border:2px solid var(--card2);
  border-radius:26px;overflow:hidden;
  width:100%;max-width:290px;height:210px;
  position:relative;flex-shrink:0;
}
/* ── BLANKET ── */
.blkout{position:absolute;left:0;right:0;bottom:0;transition:top .3s ease;}
.blkbody{position:absolute;inset:0;
  background:linear-gradient(160deg,#1A3E8C,#122B6A 30%,#1E3F8A 60%,#122B6A);
  overflow:hidden;}
.blkpat{position:absolute;inset:0;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 12px,transparent 12px,transparent 24px);}
.blkfold{position:absolute;top:0;left:0;right:0;height:18px;
  background:linear-gradient(135deg,#2A5AB8,#1E3E90);border-radius:2px 2px 0 0;}
.blkgrip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:48px;height:5px;border-radius:99px;background:rgba(168,196,232,.55);}
/* ── RIPPLE ── */
.ripel{position:absolute;border-radius:50%;pointer-events:none;
  animation:rp .6s ease forwards;}
/* ── DONE BANNER ── */
.donebanner{text-align:center;padding:12px 24px;flex-shrink:0;animation:su .5s ease;}
</style>
</head>
<body>

<script>
/* ════════════════════════════════════════════════════
   BABY MO — Pure HTML5 + Pointer Events API
   KEY FIX: Using Pointer Events instead of Touch Events
   + touch-action:none CSS — works in iframes, all browsers
════════════════════════════════════════════════════ */

/* ── STARS ── */
(function(){
  var c=document.getElementById('stars');
  for(var i=0;i<65;i++){
    var s=document.createElement('div');
    var z=.5+Math.random()*2.6;
    s.style.cssText='position:absolute;border-radius:50%;background:#D4EEFF;'
      +'width:'+z+'px;height:'+z+'px;left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;'
      +'opacity:'+(0.1+Math.random()*.9)+';'
      +'animation:tw '+(2+Math.random()*4)+'s '+(Math.random()*6)+'s infinite ease-in-out;';
    c.appendChild(s);
  }
})();

/* ── VIB ── */
function vib(p){try{navigator.vibrate&&navigator.vibrate(p||40);}catch(e){}}

/* ── SPEAK ── */
function speak(txt){
  try{
    if(window.speechSynthesis){
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(txt);
      u.lang='ar-SA';u.rate=.45;u.pitch=1.1;u.volume=1;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

/* ── LULLABY ── */
var LUL=(function(){
  var ctx,gain,on=false,tm,ni=0,nt=0;
  var N=[[196,.8],[220,.8],[247,.6],[196,.2],[220,.9],[294,.8],[330,.6],[294,.2],
         [220,.8],[196,.6],[247,.4],[196,.2],[165,1.4],[0,.5],
         [196,.7],[220,.7],[247,.5],[294,.7],[330,.9],[294,.6],[247,.6],[220,.6],[196,1.7],[0,.9]];
  function note(f,s,d){
    if(!f||!gain)return;
    var o=ctx.createOscillator(),e=ctx.createGain(),fl=ctx.createBiquadFilter();
    fl.type='lowpass';fl.frequency.value=500;o.type='sine';o.frequency.value=f;
    o.connect(fl);fl.connect(e);e.connect(gain);
    e.gain.setValueAtTime(0,s);
    e.gain.linearRampToValueAtTime(.55,s+Math.min(.07,d*.15));
    e.gain.exponentialRampToValueAtTime(.001,s+d-.05);
    o.start(s);o.stop(s+d);
  }
  function tick(){
    while(nt<ctx.currentTime+.7){var n=N[ni%N.length];note(n[0],nt,n[1]);nt+=n[1];ni++;}
    if(on)tm=setTimeout(tick,200);
  }
  return{
    start:function(){if(on)return;try{
      ctx=new(window.AudioContext||window.webkitAudioContext)();
      gain=ctx.createGain();gain.gain.setValueAtTime(0,ctx.currentTime);
      gain.gain.linearRampToValueAtTime(.22,ctx.currentTime+6);
      gain.connect(ctx.destination);nt=ctx.currentTime+1.2;ni=0;on=true;tick();
    }catch(e){}},
    stop:function(){on=false;clearTimeout(tm);
      if(gain&&ctx){gain.gain.linearRampToValueAtTime(0,ctx.currentTime+2.5);
        setTimeout(function(){try{ctx.close();}catch(e){}ctx=null;},3500);}},
  };
})();

/* ── SCREENS ── */
function show(id){
  document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on');});
  document.getElementById('s-'+id).classList.add('on');
}

/* ── HOME ── */
document.getElementById('btn-start').addEventListener('click',function(){
  vib(60);show('steps');runStep(0);
});
document.getElementById('btn-home').addEventListener('click',function(){
  vib(40);show('home');
});

/* ── PROGRESS ── */
function setP(idx){
  document.getElementById('pfill').style.width=(idx/4*100)+'%';
}

/* ── STEP ENGINE ── */
var BUILDERS=[buildBrush,buildPajamas,buildDoa,buildBlanket];

function runStep(idx){
  setP(idx);
  var body=document.getElementById('stepbody');
  body.innerHTML='';
  body.style.cssText='flex:1;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(30px);';
  BUILDERS[idx](body,function(){
    body.style.cssText='flex:1;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(-24px);transition:all .38s ease;';
    setTimeout(function(){
      if(idx+1<BUILDERS.length){runStep(idx+1);}
      else{show('sleep');startSleep();}
    },400);
  });
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    body.style.cssText='flex:1;display:flex;flex-direction:column;overflow:hidden;'
      +'opacity:1;transform:translateY(0);transition:all .5s cubic-bezier(.34,1.56,.64,1);';
  });});
}

/* ── RIPPLE ── */
function addRipple(el,e,color){
  var r=document.createElement('div');
  r.className='ripel';
  var rect=el.getBoundingClientRect();
  var x=e.clientX-rect.left, y=e.clientY-rect.top;
  var sz=Math.max(rect.width,rect.height)*2;
  r.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(x-sz/2)+'px;top:'+(y-sz/2)+'px;'
    +'background:'+(color||'rgba(255,255,255,.3)')+';';
  el.appendChild(r);
  setTimeout(function(){r.remove();},700);
}

/* ══════════════════════════════════════════════════
   STEP 1 — BRUSH TEETH
   POINTER EVENTS: pointerdown / pointermove / pointerup
   + setPointerCapture for continuous tracking
   + touch-action:none on element (CSS approach)
══════════════════════════════════════════════════ */
function buildBrush(wrap,done){
  var NEED=7, count=0, bx=50, finished=false;
  var pdown=false, refX=0, lastDir=null, moveX=0;
  var FACES=['😐','🙂','😊','😄','🤩','✨','😁'];

  wrap.innerHTML=
    '<div class="shead">'
      +'<div class="snum">Langkah 1 dari 4</div>'
      +'<div class="stitle">🪥 Gosok Gigi</div>'
      +'<div class="shint">Geser kiri ← → kanan untuk menyikat!</div>'
    +'</div>'
    /* Baby Mo at sink SVG */
    +'<div style="display:flex;justify-content:center;padding:8px 0;flex-shrink:0;">'
      +'<svg width="150" height="130" viewBox="0 0 150 130">'
        +'<ellipse cx="75" cy="120" rx="46" ry="18" fill="#3D7A2E"/>'
        +'<ellipse cx="75" cy="104" rx="44" ry="30" fill="#4A9438"/>'
        +'<circle cx="75" cy="64" r="46" fill="#F5C895"/>'
        +'<circle cx="24" cy="28" r="16" fill="#4A9438"/><circle cx="24" cy="28" r="9.5" fill="#5DB347"/>'
        +'<circle cx="126" cy="28" r="16" fill="#4A9438"/><circle cx="126" cy="28" r="9.5" fill="#5DB347"/>'
        +'<circle cx="56" cy="58" r="13" fill="white"/><circle cx="94" cy="58" r="13" fill="white"/>'
        +'<circle cx="58" cy="59" r="8.5" fill="#1C1008"/><circle cx="96" cy="59" r="8.5" fill="#1C1008"/>'
        +'<circle cx="61" cy="56" r="3" fill="white"/><circle cx="99" cy="56" r="3" fill="white"/>'
        +'<ellipse cx="75" cy="74" rx="6.5" ry="5" fill="#E8956A"/>'
        /* open mouth with teeth */
        +'<path d="M55 84 Q75 102 95 84" fill="#160606"/>'
        +'<rect id="t0" x="57" y="79" width="10" height="12" rx="3"/>'
        +'<rect id="t1" x="69" y="77" width="12" height="14" rx="3"/>'
        +'<rect id="t2" x="83" y="79" width="10" height="12" rx="3"/>'
        +'<circle cx="42" cy="74" r="12" fill="#FFB8A0" opacity=".42"/>'
        +'<circle cx="108" cy="74" r="12" fill="#FFB8A0" opacity=".42"/>'
        /* arm with toothbrush */
        +'<rect x="98" y="60" width="14" height="36" rx="7" fill="#F5C895" transform="rotate(22 105 78)"/>'
        +'<rect x="110" y="52" width="7" height="28" rx="3.5" fill="#4A9438" transform="rotate(22 113 66)"/>'
        +'<rect x="114" y="46" width="20" height="7" rx="3.5" fill="#78CC64" transform="rotate(22 124 49)"/>'
      +'</svg>'
    +'</div>'
    /* Progress */
    +'<div style="padding:0 24px;flex-shrink:0;">'
      +'<div style="background:rgba(255,255,255,.1);border-radius:99px;height:9px;overflow:hidden;margin-bottom:5px;">'
        +'<div id="bprog" style="height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#7EE8DC);transition:width .3s;"></div>'
      +'</div>'
      +'<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--text3);">'
        +'<span>Mulai</span><span id="bcnt" style="color:var(--teal);">0/'+NEED+'</span><span>Bersih ✓</span>'
      +'</div>'
    +'</div>'
    /* SWIPE ZONE — touch-action:none is THE key CSS rule */
    +'<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:10px 24px;">'
      +'<div style="width:100%;max-width:320px;">'
        +'<div id="bzone" style="position:relative;height:90px;border-radius:22px;'
          +'background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);'
          +'touch-action:none;cursor:grab;overflow:hidden;">'
          +'<div style="position:absolute;top:50%;left:12px;right:12px;height:3px;'
            +'background:rgba(255,255,255,.15);border-radius:99px;transform:translateY(-50%);"></div>'
          +'<div id="bfill" style="position:absolute;top:50%;left:12px;width:0%;height:3px;'
            +'background:linear-gradient(90deg,var(--teal),transparent);transform:translateY(-50%);"></div>'
          +'<div id="bbrush" style="position:absolute;top:50%;left:50%;font-size:46px;line-height:1;'
            +'transform:translateX(-50%) translateY(-50%) rotate(22deg);pointer-events:none;'
            +'filter:drop-shadow(0 3px 14px rgba(62,207,184,.55));">🪥</div>'
          +'<div id="barrows" style="position:absolute;bottom:8px;left:0;right:0;pointer-events:none;'
            +'display:flex;justify-content:space-between;padding:0 18px;'
            +'font-size:22px;color:rgba(255,255,255,.25);animation:pu 1.8s infinite;">'
            +'<span>←</span><span>→</span>'
          +'</div>'
        +'</div>'
        +'<div id="breact" style="text-align:center;margin-top:10px;font-size:24px;min-height:30px;"></div>'
      +'</div>'
    +'</div>'
    +'<div id="bdone" style="display:none;" class="donebanner">'
      +'<div style="font-size:44px;">✨😁✨</div>'
      +'<div style="font-size:22px;font-weight:900;color:var(--teal);">Gigi bersih &amp; putih!</div>'
    +'</div>';

  /* Tooth color */
  function refreshTeeth(){
    var p=count/NEED;
    var c='hsl('+(190-p*185)+','+(30+p*55)+'%,'+(44+p*38)+'%)';
    ['t0','t1','t2'].forEach(function(id){
      var el=document.getElementById(id);
      if(el)el.setAttribute('fill',c);
    });
  }
  refreshTeeth();

  function addStroke(dir){
    if(dir===lastDir||finished)return;
    lastDir=dir; count=Math.min(count+1,NEED); vib(35);
    document.getElementById('bcnt').textContent=count+'/'+NEED;
    document.getElementById('bprog').style.width=(count/NEED*100)+'%';
    document.getElementById('breact').textContent=FACES[Math.min(count,6)];
    refreshTeeth();
    if(count>=NEED&&!finished){
      finished=true; vib(100);
      var arrows=document.getElementById('barrows');
      if(arrows)arrows.style.display='none';
      document.getElementById('breact').textContent='😁 Bersih!';
      document.getElementById('bdone').style.display='block';
      setTimeout(done,1100);
    }
  }

  function updateBrush(){
    var el=document.getElementById('bbrush');
    var fill=document.getElementById('bfill');
    if(!el)return;
    el.style.left=bx+'%';
    el.style.transform='translateX(-50%) translateY(-50%) rotate('+(bx>50?-26:26)+'deg)';
    if(fill)fill.style.width=Math.max(0,bx-12)/76*100+'%';
  }

  var zone=document.getElementById('bzone');

  /* ★ POINTER EVENTS — the correct modern approach ★ */
  zone.addEventListener('pointerdown',function(e){
    pdown=true;
    refX=e.clientX; moveX=e.clientX;
    lastDir=null;
    zone.setPointerCapture(e.pointerId);
  });

  zone.addEventListener('pointermove',function(e){
    if(!pdown)return;
    /* Smooth brush movement */
    var dx=e.clientX-moveX; moveX=e.clientX;
    bx=Math.max(10,Math.min(90,bx+(dx/zone.clientWidth)*115));
    updateBrush();
    /* Direction change detection from refX */
    var total=e.clientX-refX;
    if(total>38&&lastDir!=='R'){addStroke('R');lastDir='R';refX=e.clientX;}
    else if(total<-38&&lastDir!=='L'){addStroke('L');lastDir='L';refX=e.clientX;}
  });

  zone.addEventListener('pointerup',function(){
    pdown=false;
    if(!finished){bx=50;updateBrush();}
  });
  zone.addEventListener('pointercancel',function(){
    pdown=false;
    if(!finished){bx=50;updateBrush();}
  });
}

/* ══════════════════════════════════════════════════
   STEP 2 — PAJAMAS (tap items)
══════════════════════════════════════════════════ */
function buildPajamas(wrap,done){
  var items=[
    {emoji:'👕',label:'Baju Tidur',  color:'#A97FFF'},
    {emoji:'🩲',label:'Celana Tidur', color:'#7EA5FF'},
    {emoji:'🧸',label:'Boneka',       color:'#FFD93D'},
  ];
  var tapped=0;

  wrap.innerHTML=
    '<div class="shead">'
      +'<div class="snum">Langkah 2 dari 4</div>'
      +'<div class="stitle">👕 Ganti Baju</div>'
      +'<div class="shint">Ketuk setiap baju untuk memakainya!</div>'
    +'</div>'
    /* Mini Baby Mo */
    +'<div style="display:flex;justify-content:center;padding:8px 0;flex-shrink:0;">'
      +'<div id="pjchar" style="font-size:72px;transition:all .5s;">🧒</div>'
    +'</div>'
    +'<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:8px 24px;">'
      +'<div class="pjgrid" id="pjgrid"></div>'
    +'</div>'
    +'<div id="pjdone" style="display:none;" class="donebanner">'
      +'<div style="font-size:44px;">🌙✨</div>'
      +'<div style="font-size:22px;font-weight:900;color:var(--purple);">Siap untuk tidur!</div>'
    +'</div>';

  var grid=document.getElementById('pjgrid');
  items.forEach(function(item,i){
    var el=document.createElement('div');
    el.className='pjitem';
    if(i===2)el.style.gridColumn='1/-1';
    el.innerHTML='<div style="font-size:54px;line-height:1;margin-bottom:8px;transition:all .3s;">'
      +item.emoji+'</div>'
      +'<div style="font-size:13px;font-weight:800;color:var(--text2);transition:color .3s;">'
      +item.label+'</div>';

    function tap(e){
      if(el.dataset.done)return;
      el.dataset.done='1'; tapped++; vib(45);
      addRipple(el,e,item.color+'44');
      el.style.borderColor=item.color;
      el.style.background=item.color+'18';
      el.style.transform='scale(.96)';
      el.querySelector('div').textContent='✅';
      el.querySelector('div').style.animation='pk .5s cubic-bezier(.34,1.56,.64,1)';
      el.querySelectorAll('div')[1].textContent='Sudah! ✓';
      el.querySelectorAll('div')[1].style.color=item.color;
      if(tapped>=items.length){
        document.getElementById('pjchar').textContent='🌙';
        document.getElementById('pjdone').style.display='block';
        vib([70,35,70]); setTimeout(done,800);
      }
    }
    el.addEventListener('click',tap);
    el.addEventListener('pointerdown',function(e){e.preventDefault();},{passive:false});
    el.addEventListener('pointerup',tap);
    grid.appendChild(el);
  });
}

/* ══════════════════════════════════════════════════
   STEP 3 — DUA
══════════════════════════════════════════════════ */
function buildDoa(wrap,done){
  var duas=[
    {ar:'بِسْمِكَ اللَّهُمَّ',la:'Bismika Allāhumma',me:'Dengan nama-Mu ya Allah',sp:'بسمك اللهم',co:'#FFD93D'},
    {ar:'أَحْيَا وَأَمُوتُ',la:'ahyā wa amūtu',me:'aku hidup dan aku mati',sp:'أحيا وأموت',co:'#A97FFF'},
    {ar:'اللَّهُمَّ أَمِتْنِي',la:'Allāhumma amitni',me:'Ya Allah matikanlah aku',sp:'اللهم أمتني',co:'#3ECFB8'},
  ];
  var doneCnt=0, playing=false;

  wrap.innerHTML=
    '<div class="shead">'
      +'<div class="snum">Langkah 3 dari 4</div>'
      +'<div class="stitle">🤲 Baca Doa</div>'
      +'<div class="shint">Ketuk setiap baris — dengar &amp; ulangi!</div>'
    +'</div>'
    +'<div style="display:flex;justify-content:center;padding:6px 0;flex-shrink:0;">'
      +'<div style="font-size:68px;animation:fl 3s ease-in-out infinite;">🤲</div>'
    +'</div>'
    +'<div style="text-align:center;padding:0 24px 8px;flex-shrink:0;">'
      +'<span style="display:inline-block;background:rgba(255,217,61,.1);border:1px solid rgba(255,217,61,.3);'
        +'border-radius:99px;padding:5px 16px;font-size:11px;font-weight:800;letter-spacing:2px;'
        +'text-transform:uppercase;color:rgba(255,217,61,.8);">🌙 Doa Sebelum Tidur</span>'
    +'</div>'
    +'<div style="flex:1;overflow-y:auto;padding:0 24px 10px;" id="dualist"></div>'
    +'<div id="dwavewrap" style="display:none;justify-content:center;align-items:flex-end;height:30px;gap:4px;padding-bottom:8px;flex-shrink:0;"></div>'
    +'<div id="ddone" style="display:none;" class="donebanner">'
      +'<div style="font-size:44px;">🤲</div>'
      +'<div style="font-size:22px;font-weight:900;color:var(--gold);">Aamiin ya Rabb... 🌙</div>'
    +'</div>';

  /* Wave */
  var ww=document.getElementById('dwavewrap');
  [2,3,5,4,7,5,3,2,4,6].forEach(function(h,i){
    var b=document.createElement('div');
    b.style.cssText='width:5px;height:'+(h*3.5)+'px;background:rgba(255,217,61,.5);border-radius:99px;'
      +'animation:wv '+(0.44+i*.1)+'s '+(i*.07)+'s ease-in-out infinite;transform-origin:bottom;';
    ww.appendChild(b);
  });

  var list=document.getElementById('dualist');
  duas.forEach(function(d,i){
    var el=document.createElement('div');
    el.className='dualine'+(i>0?' locked':'');
    el.id='dl'+i;
    el.innerHTML='<div style="font-size:26px;font-family:serif;font-weight:700;text-align:right;'
      +'direction:rtl;line-height:1.8;color:white;transition:color .3s;">'+d.ar+'</div>'
      +'<div style="font-size:13px;font-weight:700;color:var(--text2);font-style:italic;margin-top:2px;">'+d.la+'</div>'
      +'<div style="font-size:12px;color:var(--text3);margin-top:2px;">'+d.me+'</div>'
      +'<div id="di'+i+'" style="position:absolute;top:14px;right:16px;font-size:22px;">'
      +(i===0?'👆':'🔒')+'</div>';

    function tap(){
      if(el.classList.contains('locked')||playing)return;
      playing=true; vib(45);
      el.classList.add('active');
      document.getElementById('di'+i).textContent='🔊';
      document.getElementById('dwavewrap').style.display='flex';
      speak(d.sp);
      setTimeout(function(){
        playing=false;
        el.classList.remove('active'); el.classList.add('finished');
        el.style.borderColor=d.co;
        el.querySelector('div').style.color=d.co;
        document.getElementById('di'+i).textContent='✅';
        document.getElementById('dwavewrap').style.display='none';
        doneCnt++;
        if(doneCnt<duas.length){
          var nx=document.getElementById('dl'+doneCnt);
          nx.classList.remove('locked');
          document.getElementById('di'+doneCnt).textContent='👆';
        } else {
          document.getElementById('ddone').style.display='block';
          vib([60,30,60,30,100]);
          setTimeout(done,1200);
        }
      },1850);
    }
    el.addEventListener('click',tap);
    el.addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')tap();});
    list.appendChild(el);
  });
}

/* ══════════════════════════════════════════════════
   STEP 4 — DRAG BLANKET
   POINTER EVENTS + setPointerCapture
══════════════════════════════════════════════════ */
function buildBlanket(wrap,done){
  var prog=0, pdown=false, startY=0, startProg=0, finished=false;

  wrap.innerHTML=
    '<div class="shead">'
      +'<div class="snum">Langkah 4 dari 4</div>'
      +'<div class="stitle" id="bltitle">🌙 Tarik Selimut</div>'
      +'<div class="shint" id="blhint">Seret selimut ke atas untuk tidur!</div>'
    +'</div>'
    +'<div id="dragzone" style="flex:1;display:flex;flex-direction:column;align-items:center;'
      +'justify-content:center;padding:12px 24px 20px;touch-action:none;cursor:grab;">'
      +'<div class="bedframe">'
        +'<div style="position:absolute;top:0;left:0;right:0;height:20px;'
          +'background:var(--card2);border-radius:24px 24px 0 0;"></div>'
        +'<div style="position:absolute;top:26px;left:16px;right:16px;height:66px;'
          +'background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);'
          +'border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:visible;">'
          +'<div id="blface" style="font-size:54px;transition:all .5s;">👁️</div>'
          +'<div id="zzzwrap" style="display:none;position:absolute;right:6px;top:-16px;">'
            +'<span style="font-size:13px;color:rgba(126,165,255,.38);animation:zf 1.5s 0s ease infinite;display:inline-block;">z</span>'
            +'<span style="font-size:19px;color:rgba(126,165,255,.48);animation:zf 1.9s .4s ease infinite;display:inline-block;">z</span>'
            +'<span style="font-size:26px;color:rgba(126,165,255,.55);animation:zf 2.3s .8s ease infinite;display:inline-block;">z</span>'
          +'</div>'
        +'</div>'
        +'<div style="position:absolute;bottom:0;left:0;right:0;height:52%;background:rgba(8,18,36,.9);"></div>'
        +'<div id="blkout" class="blkout" style="top:88%;">'
          +'<div class="blkbody"><div class="blkpat"></div>'
            +'<div style="position:absolute;top:14px;left:0;right:0;display:flex;'
              +'justify-content:space-evenly;font-size:11px;color:rgba(200,220,255,.18);">'
              +'<span>★</span><span>✦</span><span>★</span><span>✦</span><span>★</span><span>✦</span>'
            +'</div>'
          +'</div>'
          +'<div class="blkfold"><div id="blkgrip" class="blkgrip"></div></div>'
        +'</div>'
      +'</div>'
      +'<div id="blarrow" style="margin-top:22px;text-align:center;color:var(--text3);'
        +'font-size:13px;font-weight:800;animation:fl 1.8s ease-in-out infinite;pointer-events:none;">'
        +'<div style="font-size:30px;">↑</div><div>Seret ke atas</div>'
      +'</div>'
    +'</div>';

  function updateFace(){
    var f=document.getElementById('blface');
    if(!f)return;
    if(finished)f.textContent='😴';
    else if(prog>.6)f.textContent='🌙';
    else if(prog>.25)f.textContent='😌';
    else f.textContent='👁️';
    var blk=document.getElementById('blkout');
    if(blk)blk.style.top=(88-prog*72)+'%';
    if(prog>.07){var a=document.getElementById('blarrow');if(a)a.style.display='none';}
  }

  function onFinish(){
    if(finished)return; finished=true; vib([80,40,120]);
    var gr=document.getElementById('blkgrip'); if(gr)gr.style.display='none';
    var zz=document.getElementById('zzzwrap'); if(zz)zz.style.display='block';
    var t=document.getElementById('bltitle'); if(t)t.textContent='💤 Selamat Tidur!';
    var h=document.getElementById('blhint'); if(h)h.textContent='Baby Mo sudah tidur... 🌙';
    var f=document.getElementById('blface');
    if(f){f.textContent='😴';f.style.filter='drop-shadow(0 0 18px rgba(255,217,61,.55))';}
    setTimeout(done,1300);
  }

  var dz=document.getElementById('dragzone');

  /* ★ POINTER EVENTS for blanket drag ★ */
  dz.addEventListener('pointerdown',function(e){
    pdown=true; startY=e.clientY; startProg=prog;
    dz.setPointerCapture(e.pointerId);
  });

  dz.addEventListener('pointermove',function(e){
    if(!pdown||finished)return;
    var dy=startY-e.clientY;
    var H=dz.clientHeight||260;
    prog=Math.max(0,Math.min(1,startProg+dy/(H*.58)));
    var blk=document.getElementById('blkout');
    if(blk)blk.style.transition='none';
    updateFace();
    if(prog>=1)onFinish();
  });

  dz.addEventListener('pointerup',function(){
    pdown=false;
    if(!finished&&prog<.38){
      prog=0;
      var blk=document.getElementById('blkout');
      if(blk)blk.style.transition='top .4s ease';
      updateFace();
    }
  });
  dz.addEventListener('pointercancel',function(){pdown=false;});

  updateFace();
}

/* ══════════════════════════════════════════════════
   SLEEP MODE
══════════════════════════════════════════════════ */
function startSleep(){
  LUL.start();
  var viz=document.getElementById('viz');
  [2,3,5,4,7,5,4,3,5,7].forEach(function(h,i){
    var b=document.createElement('div');
    b.style.cssText='width:5px;height:'+(h*4)+'px;border-radius:99px;'
      +'background:rgba(62,207,184,'+(0.18+i*.027)+');'
      +'animation:wv '+(0.55+i*.13)+'s '+(i*.09)+'s ease-in-out infinite;transform-origin:bottom;';
    viz.appendChild(b);
  });
  setTimeout(function(){document.getElementById('sleepcontent').style.opacity='1';},600);
  var dim=document.getElementById('sleepdim'),d=0;
  var iv=setInterval(function(){d=Math.min(d+.003,.78);dim.style.opacity=d;if(d>=.78)clearInterval(iv);},130);
}
</script>
